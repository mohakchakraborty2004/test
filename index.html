<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #0f172a, #312e81);
      }

      main {
        width: min(90%, 42rem);
        padding: 4rem 2rem;
        text-align: center;
        background: rgb(255 255 255 / 10%);
        border: 1px solid rgb(255 255 255 / 20%);
        border-radius: 1.5rem;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 25%);
      }

      h1 {
        margin: 0 0 1rem;
        color: #fff;
        font-size: clamp(2.5rem, 8vw, 5rem);
      }

      p {
        max-width: 32rem;
        margin: 0 auto 2rem;
        font-size: 1.125rem;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        padding: 0.8rem 1.4rem;
        color: #1e1b4b;
        font-weight: 700;
        text-decoration: none;
        background: #c4b5fd;
        border-radius: 999px;
      }

      a:hover,
      a:focus-visible {
        background: #ddd6fe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome</h1>
      <p>
        This is a simple place to explore, build, and turn new ideas into
        something meaningful.
      </p>
      <a href="mailto:hello@example.com">Get in touch</a>
    </main>
  </body>
</html>
